<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="auroraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#auroraBg)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Radial Glow Behind -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Aurora Northern Lights Waves -->
  <path d="M 22 75 Q 40 45, 60 62 T 98 48" fill="none" stroke="url(#auroraGrad)" stroke-width="4" stroke-linecap="round" opacity="0.75" filter="url(#auroraGlow)"/>
  <path d="M 24 62 Q 44 80, 64 56 T 96 68" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Stylized Geometric 'A' Peak with Polar Star -->
  <path d="M 60 25 L 82 85 L 69 85 L 63 68 L 57 68 L 51 85 L 38 85 Z" fill="url(#auroraGrad)" filter="url(#auroraGlow)"/>
  <!-- Inner A cutout -->
  <polygon points="60,42 66,60 54,60" fill="#040914"/>

  <!-- North Star / Sparkle at the Apex -->
  <circle cx="60" cy="24" r="3.5" fill="#ffffff" filter="url(#auroraGlow)"/>
  <path d="M 60 16 L 60 32 M 52 24 L 68 24" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
</svg>
